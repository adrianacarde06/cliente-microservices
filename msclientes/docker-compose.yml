services:
  ms-clientes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-clientes-app
    ports:
      - "8080:8080"
    environment:
      # Perfil por defecto o uno específico para docker si lo tuvieras
      - SPRING_PROFILES_ACTIVE=default
      # Al ser H2 en memoria, no necesitas variables de conexión externas
    networks:
      - ms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ms-network:
    driver: bridge